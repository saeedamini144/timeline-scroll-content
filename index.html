<section class="nd-process2">
    <div class="nd-process2__layout">

        <!-- Left: sticky panel, shows the content of the step currently reached while scrolling -->
        <aside class="nd-process2__panel" id="ndPanel" aria-live="polite"></aside>

        <!-- Right: the timeline -->
        <div class="nd-process2__timeline" id="ndTimeline">
            <div class="nd-process2__rail" id="ndRail">
                <div class="nd-process2__rail-fill" id="ndRailFill"></div>
            </div>
            <div class="nd-process2__steps" id="ndSteps"></div>
        </div>

    </div>
</section>

<style>
    .nd-process2 {
        --nd-title: #1D2224;
        --nd-text: #5B605F;
        --nd-dim: #8B9296;
        --nd-rail: rgba(29, 34, 36, 0.14);
        --nd-node-bg: #FFFFFF;
        --nd-node-border: rgba(29, 34, 36, 0.18);
        --nd-node-text: #8B9296;
        --nd-media-bg: rgba(29, 34, 36, 0.06);
        --nd-accent: #FA3000;


        background: transparent;
        color: var(--nd-title);
    }

    .nd-process2,
    .nd-process2 *,
    .nd-process2 *::before,
    .nd-process2 *::after {
        box-sizing: border-box;
    }

    .nd-process2 img {
        max-width: 100%;
    }

    .nd-process2 h3,
    .nd-process2 h4,
    .nd-process2 p {
        overflow-wrap: anywhere;
    }

    /* ---------- Layout ---------- */

    .nd-process2__layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: clamp(32px, 6vw, 88px);
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 32px);
    }

    /* ---------- Left panel ---------- */

    .nd-process2__panel {
        position: sticky;
        top: clamp(16px, 12vh, 120px);
        align-self: start;
        display: grid;
    }

    /* every item sits in the same grid cell, so the panel keeps the height of the tallest one */
    .nd-process2__detail {
        grid-area: 1 / 1;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    }

    .nd-process2__detail.is-current {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition: opacity .45s ease, transform .45s ease, visibility 0s;
    }

    .nd-process2__eyebrow {
        display: block;
        margin: 0 0 10px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--nd-accent);
    }

    .nd-process2__heading {
        margin: 0 0 14px;
        font-size: clamp(1.5rem, 2.6vw, 2.1rem);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--nd-title);
    }

    .nd-process2__body {
        margin: 0 0 24px;
        max-width: 56ch;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--nd-text);
    }

    .nd-process2__media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .nd-process2__media img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 12px;
        background: var(--nd-media-bg);
        color: transparent;
        /* hide the alt text if an image fails to load */
    }

    /* first image is the large one, the rest sit in a row below it */
    .nd-process2__media img:first-child {
        grid-column: 1 / -1;
        aspect-ratio: 16 / 9;
    }

    /* a step with only two images: the single small one spans the full width */
    .nd-process2__media img:nth-child(2):last-child {
        grid-column: 1 / -1;
        aspect-ratio: 16 / 7;
    }

    /* ---------- Right timeline ---------- */

    .nd-process2__timeline {
        position: relative;
        /* extra room so the last step can reach the middle of the screen and the sticky panel stays until then */
        padding-bottom: clamp(80px, 42vh, 420px);
    }

    .nd-process2__rail {
        position: absolute;
        top: 20px;
        inset-inline-start: 19px;
        width: 2px;
        height: 0;
        /* set by JS: ends exactly at the centre of the last node */
        background: var(--nd-rail);
        border-radius: 2px;
    }

    .nd-process2__rail-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 0;
        background: var(--nd-accent);
        border-radius: 2px;
        transition: height .1s linear;
    }

    .nd-process2__steps {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
    }

    .nd-process2__step {
        display: flex;
        align-items: flex-start;
        gap: 26px;
        /* tall enough that each step gets its own stretch of scrolling */
        padding-bottom: clamp(120px, 24vh, 260px);
    }

    .nd-process2__step:last-child {
        padding-bottom: 0;
    }

    .nd-process2__node {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--nd-node-bg);
        border: 1px solid var(--nd-node-border);
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--nd-node-text);
        transition: border-color .4s ease, color .4s ease, background .4s ease, box-shadow .4s ease;
    }

    .nd-process2__step.is-active .nd-process2__node {
        background: var(--nd-accent);
        border-color: var(--nd-accent);
        color: #F7F5F1;
        box-shadow: 0 0 0 4px rgba(250, 48, 0, 0.18);
    }

    .nd-process2__content {
        min-width: 0;
        padding-top: 5px;
    }

    .nd-process2__step-title {
        font-size: clamp(1.2rem, 1.7vw, 1.45rem);
        font-weight: 500;
        margin: 0 0 10px;
        color: var(--nd-title);
        opacity: 0.4;
        transition: opacity .4s ease;
    }

    .nd-process2__text {
        margin: 0;
        max-width: 52ch;
        color: var(--nd-dim);
        font-size: 0.96rem;
        line-height: 1.65;
        opacity: 0.7;
        transition: opacity .4s ease, color .4s ease;
    }

    .nd-process2__step.is-active .nd-process2__step-title {
        opacity: 1;
    }

    .nd-process2__step.is-active .nd-process2__text {
        opacity: 1;
        color: var(--nd-text);
    }

    /* the copy of the detail that lives inside each step: mobile / tablet only */
    .nd-process2__inline {
        display: none;
    }

    /* ---------- Desktop: keep the sticky panel shorter than the screen ---------- */

    @media (min-width: 901px) {
        .nd-process2__media img {
            max-height: 18vh;
        }

        .nd-process2__media img:first-child {
            max-height: 34vh;
        }
    }

    /* short desktop windows / landscape laptops: drop the small images and tighten the text */
    @media (min-width: 901px) and (max-height: 700px) {
        .nd-process2__media img:not(:first-child) {
            display: none;
        }

        .nd-process2__heading {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .nd-process2__body {
            margin-bottom: 16px;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .nd-process2__step {
            padding-bottom: 110px;
        }
    }

    /* ---------- Narrow desktop / large tablet landscape: still two columns, just tighter ---------- */

    @media (min-width: 901px) and (max-width: 1100px) {
        .nd-process2__layout {
            column-gap: 32px;
        }

        .nd-process2__step {
            gap: 18px;
        }

        .nd-process2__body {
            font-size: 0.95rem;
        }
    }

    /* ---------- Tablet portrait + phones: single column, details move inside each step ---------- */

    @media (max-width: 900px) {
        .nd-process2__layout {
            grid-template-columns: minmax(0, 1fr);
            max-width: 720px;
        }

        .nd-process2__panel {
            display: none;
        }

        .nd-process2__timeline {
            padding-bottom: clamp(24px, 8vh, 80px);
        }

        .nd-process2__inline {
            display: block;
            margin-top: 20px;
        }

        .nd-process2__inline .nd-process2__heading {
            font-size: clamp(1.1rem, 2.6vw, 1.35rem);
        }

        .nd-process2__step {
            gap: 16px;
            padding-bottom: clamp(48px, 10vw, 72px);
        }

        .nd-process2__node {
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            font-size: 0.78rem;
        }

        .nd-process2__rail {
            inset-inline-start: 15px;
            top: 16px;
        }

        .nd-process2__content {
            padding-top: 4px;
        }

        .nd-process2__text,
        .nd-process2__body {
            max-width: none;
        }

        .nd-process2__body {
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .nd-process2__media img:not(:first-child) {
            aspect-ratio: 4 / 3;
        }

        .nd-process2__media img:nth-child(2):last-child {
            aspect-ratio: 16 / 7;
        }
    }

    /* ---------- Small phones ---------- */

    @media (max-width: 480px) {
        .nd-process2__layout {
            padding: 0 16px;
        }

        .nd-process2__step {
            gap: 12px;
            padding-bottom: 44px;
        }

        .nd-process2__media {
            gap: 8px;
        }

        .nd-process2__media img {
            border-radius: 10px;
        }

        .nd-process2__text {
            font-size: 0.92rem;
        }
    }

    @media (max-width: 360px) {
        .nd-process2__step-title {
            font-size: 1.1rem;
        }

        .nd-process2__text,
        .nd-process2__body {
            font-size: 0.88rem;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        .nd-process2__rail-fill,
        .nd-process2__node,
        .nd-process2__step-title,
        .nd-process2__text,
        .nd-process2__detail,
        .nd-process2__detail.is-current {
            transition: none;
        }
    }
</style>

<script>
    (function () {
        /*
         * Edit steps here. Numbering is automatic.
         *  - title / text : shown on the timeline (right)
         *  - content      : shown in the left panel when the step is reached
         *      subtitle  small label above the heading
         *      heading   content title
         *      body      paragraph
         *      images    1-3 image URLs (the first one is shown large). Replace the placeholders.
         */
        var steps = [
            {
                title: 'Discovery & positioning',
                text: 'We learn your business, your buyers, and your competitors, then define the one position your brand should own in a crowded market.',
                content: {
                    subtitle: 'Phase 01 · Research',
                    heading: 'Finding the position only you can own',
                    body: 'Stakeholder interviews, customer conversations and a competitive audit show where the market is crowded and where it is empty. The result is a positioning statement the whole identity is built on.',
                    images: ['https://picsum.photos/seed/nd-discovery-1/1200/675', 'https://picsum.photos/seed/nd-discovery-2/800/500', 'https://picsum.photos/seed/nd-discovery-3/800/500']
                }
            },
            {
                title: 'Naming & messaging',
                text: 'If a name is needed, we develop and test options. Either way, we set the messaging pillars and tone of voice your brand will speak in everywhere.',
                content: {
                    subtitle: 'Phase 02 · Language',
                    heading: 'A name and a voice people remember',
                    body: 'We generate and test name candidates, then define messaging pillars, taglines and a tone-of-voice guide so every sentence sounds like the same brand.',
                    images: ['https://picsum.photos/seed/nd-naming-1/1200/675', 'https://picsum.photos/seed/nd-naming-2/800/500']
                }
            },
            {
                title: 'Logo exploration',
                text: 'Several distinct directions for mark and logotype, sketched and tested against your positioning — not one idea refined too early.',
                content: {
                    subtitle: 'Phase 03 · Concept',
                    heading: 'Wide before narrow',
                    body: 'We sketch several unrelated directions and test each against the positioning, so the final choice is a decision between real options, not a default.',
                    images: ['https://picsum.photos/seed/nd-logo-1/1200/675', 'https://picsum.photos/seed/nd-logo-2/800/500', 'https://picsum.photos/seed/nd-logo-3/800/500']
                }
            },
            {
                title: 'Logotype refinement',
                text: 'The chosen direction is refined and stress-tested: small sizes, single color, dark and light backgrounds, favicon and app-icon crops.',
                content: {
                    subtitle: 'Phase 04 · Craft',
                    heading: 'Refined until it holds up everywhere',
                    body: 'Spacing, proportions and details are tuned, then the mark is pushed through real conditions: 16px favicons, one-color print, reversed on dark.',
                    images: ['https://picsum.photos/seed/nd-refine-1/1200/675', 'https://picsum.photos/seed/nd-refine-2/800/500']
                }
            },
            {
                title: 'Color & type system',
                text: 'A palette and type scale built to work across print, screen, and languages — not just the three colors that looked good in a mockup.',
                content: {
                    subtitle: 'Phase 05 · System',
                    heading: 'Color and type that scale',
                    body: 'Primary and supporting palettes with accessibility ratios, plus a type scale and font pairing tested across print, web and multiple scripts.',
                    images: ['https://picsum.photos/seed/nd-system-1/1200/675', 'https://picsum.photos/seed/nd-system-2/800/500', 'https://picsum.photos/seed/nd-system-3/800/500']
                }
            },
            {
                title: 'Guidelines',
                text: 'A brand book showing correct and incorrect usage, spacing, co-branding rules, and real application examples — so anyone can apply the identity consistently.',
                content: {
                    subtitle: 'Phase 06 · Documentation',
                    heading: 'A brand book people actually use',
                    body: 'Clear do and don’t pages, clear-space rules, co-branding and real examples, so a new designer or vendor can apply the identity correctly without calling us.',
                    images: ['https://picsum.photos/seed/nd-guide-1/1200/675', 'https://picsum.photos/seed/nd-guide-2/800/500']
                }
            },
            {
                title: 'Application & handover',
                text: 'The identity applied to real touchpoints — business cards, packaging, social templates, signage — then handed over with source files and a walkthrough for your team.',
                content: {
                    subtitle: 'Phase 07 · Launch',
                    heading: 'From files to the real world',
                    body: 'We apply the identity to business cards, packaging, social templates and signage, then hand over organised source files and walk your team through them.',
                    images: ['https://picsum.photos/seed/nd-launch-1/1200/675', 'https://picsum.photos/seed/nd-launch-2/800/500', 'https://picsum.photos/seed/nd-launch-3/800/500']
                }
            }
        ];

        var panel = document.getElementById('ndPanel');
        var wrap = document.getElementById('ndSteps');
        var rail = document.getElementById('ndRail');
        var railFill = document.getElementById('ndRailFill');
        if (!panel || !wrap || !rail || !railFill) return;

        var LINE = 0.5; // a step counts as reached once its node passes this fraction of the viewport height

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // The same markup is used for the left panel (desktop) and inside each step (mobile / tablet).
        function detailHTML(c) {
            var imgs = (c.images || []).slice(0, 3).map(function (src) {
                return '<img src="' + esc(src) + '" alt="' + esc(c.heading) + '" loading="lazy" decoding="async">';
            }).join('');
            return (
                '<span class="nd-process2__eyebrow">' + esc(c.subtitle) + '</span>' +
                '<h4 class="nd-process2__heading">' + esc(c.heading) + '</h4>' +
                '<p class="nd-process2__body">' + esc(c.body) + '</p>' +
                (imgs ? '<div class="nd-process2__media">' + imgs + '</div>' : '')
            );
        }

        steps.forEach(function (step, i) {
            var el = document.createElement('div');
            el.className = 'nd-process2__step';
            el.innerHTML =
                '<div class="nd-process2__node">' + (i + 1) + '</div>' +
                '<div class="nd-process2__content">' +
                '<h3 class="nd-process2__step-title">' + esc(step.title) + '</h3>' +
                '<p class="nd-process2__text">' + esc(step.text) + '</p>' +
                '<div class="nd-process2__inline">' + detailHTML(step.content) + '</div>' +
                '</div>';
            wrap.appendChild(el);

            var d = document.createElement('div');
            d.className = 'nd-process2__detail';
            d.setAttribute('aria-hidden', 'true');
            d.innerHTML = detailHTML(step.content);
            panel.appendChild(d);
        });

        var stepEls = wrap.querySelectorAll('.nd-process2__step');
        var nodeEls = wrap.querySelectorAll('.nd-process2__node');
        var detailEls = panel.querySelectorAll('.nd-process2__detail');
        var lastCurrent = -2;
        var ticking = false;

        // The rail runs from the first node's centre to the last node's centre.
        function measure() {
            var first = stepEls[0];
            var last = stepEls[stepEls.length - 1];
            rail.style.height = (last.offsetTop - first.offsetTop) + 'px';
            update();
        }

        function update() {
            ticking = false;

            // Trigger line: a step counts as reached once its node passes the middle of the viewport.
            var line = window.innerHeight * LINE;

            var rr = rail.getBoundingClientRect();
            var fill = Math.min(rr.height, Math.max(0, line - rr.top));
            railFill.style.height = fill + 'px';

            var current = -1;
            for (var i = 0; i < nodeEls.length; i++) {
                var r = nodeEls[i].getBoundingClientRect();
                if (r.top + r.height / 2 <= line) current = i;
            }

            if (current === lastCurrent) return;
            lastCurrent = current;

            var show = Math.max(0, current); // before the first step, the first content is shown
            stepEls.forEach(function (el, i) {
                el.classList.toggle('is-active', i <= current);
            });
            detailEls.forEach(function (el, i) {
                var on = i === show;
                el.classList.toggle('is-current', on);
                el.setAttribute('aria-hidden', on ? 'false' : 'true');
            });
        }

        function onScroll() {
            if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(update);
            }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', measure);
        window.addEventListener('load', measure);
        if (window.ResizeObserver) new ResizeObserver(measure).observe(wrap);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
        measure();
    })();
</script>
